[project]
name = "stoke-backend"
version = "0.1.0"
description = "Top customers across Stripe Connect accounts"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "cachetools>=7.2.0",
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.3",
    "sqlalchemy[asyncio]>=2.1.3",
    "stripe>=15.6.1",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
kms = [
    "boto3>=1.43.108",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
