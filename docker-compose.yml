# Local Postgres for Stoke. `docker compose up -d`, then `cd backend && uv run alembic upgrade head`.
# Bound to 127.0.0.1 only. The test suite creates its own `stoke_test` database on this server.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: stoke
      POSTGRES_PASSWORD: stoke
      POSTGRES_DB: stoke
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - stoke-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stoke"]
      interval: 2s
      retries: 15

volumes:
  stoke-pg:
