# Render Blueprint: New → Blueprint, pick this repo. Values marked sync: false are asked for when the
# Blueprint is created; generate the two secrets with
#   python3 -c "import secrets; print(secrets.token_hex(32))"
# and keep a copy: losing them makes stored keys unreadable and changes every customer link.
databases:
  - name: stoke-db
    databaseName: stoke
    user: stoke
    postgresMajorVersion: "17"  # same as docker-compose.yml
    plan: basic-256mb  # free databases expire after 30 days
    ipAllowList: []  # reachable only from Render services in this region

services:
  - type: web
    name: stoke
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter  # free instances sleep, and have no pre-deploy command
    healthCheckPath: /api/healthz
    preDeployCommand: alembic upgrade head
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stoke-db
          property: connectionString
      - key: KEY_CIPHER
        value: local
      - key: STOKE_ENCRYPTION_KEY
        sync: false
      - key: CUSTOMER_ID_SECRET
        sync: false
      # Stoke's Stripe App (docs/stripe-app-setup.md): its install link, the secret key of its own Stripe
      # account, and the webhook secret backend/scripts/register_webhook.py prints.
      - key: STRIPE_APP_INSTALL_URL
        sync: false
      - key: STRIPE_APP_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # The service's address. Change both if Render assigns a different name, or when adding a domain.
      - key: ALLOWED_HOSTS
        value: stoke-y4sf.onrender.com
      - key: CORS_ORIGIN
        value: https://stoke-y4sf.onrender.com
      # The public site (the stoke-site service below): legal links and where signing out lands. Built into the
      # frontend. Update it if Render gives the site a different address.
      - key: VITE_SITE_URL
        value: https://stoke-site.onrender.com
      # Google OAuth client for sending from Gmail (docs/gmail-setup.md).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: VITE_AUTH0_DOMAIN
        sync: false
      - key: VITE_AUTH0_CLIENT_ID
        sync: false
      - key: VITE_AUTH0_AUDIENCE
        sync: false

  # The public site (site/): landing, pricing and policies, as static files on Render's CDN.
  - type: web
    name: stoke-site
    runtime: static
    buildCommand: cd site && npm ci && npm run build
    staticPublishPath: ./site/dist
    buildFilter:
      paths:
        - site/**
        - frontend/src/tokens.css
        - frontend/public/favicon.svg
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The app (the stoke service above), for Sign in and Get started.
      - key: PUBLIC_APP_URL
        value: https://stoke-y4sf.onrender.com
      # The site's own address, for canonical links and the sitemap. Update it if Render assigns a different one.
      - key: SITE_URL
        value: https://stoke-site.onrender.com
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
