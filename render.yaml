# Render Blueprint: New → Blueprint, pick this repo. Values marked sync: false are asked for when the
# Blueprint is created; generate the two secrets with
#   python3 -c "import secrets; print(secrets.token_hex(32))"
# and keep a copy: losing them makes stored keys unreadable and changes every customer link.
databases:
  - name: stoke-db
    databaseName: stoke
    user: stoke
    postgresMajorVersion: "17"  # same as docker-compose.yml
    plan: basic-256mb  # free databases expire after 30 days
    ipAllowList: []  # reachable only from Render services in this region

services:
  - type: web
    name: stoke
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter  # free instances sleep, and have no pre-deploy command
    healthCheckPath: /api/healthz
    preDeployCommand: alembic upgrade head
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stoke-db
          property: connectionString
      - key: KEY_CIPHER
        value: local
      - key: STOKE_ENCRYPTION_KEY
        sync: false
      - key: CUSTOMER_ID_SECRET
        sync: false
      # The service's address. Change both if Render assigns a different name, or when adding a domain.
      - key: ALLOWED_HOSTS
        value: stoke-y4sf.onrender.com
      - key: CORS_ORIGIN
        value: https://stoke-y4sf.onrender.com
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: VITE_AUTH0_DOMAIN
        sync: false
      - key: VITE_AUTH0_CLIENT_ID
        sync: false
      - key: VITE_AUTH0_AUDIENCE
        sync: false
